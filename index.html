
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STREETDRIVE — Open City</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="game"></canvas>

<div id="mainMenu" class="overlay">
  <div class="menu-card">
    <div class="eyebrow">OPEN WORLD DRIVING</div>
    <h1>STREET<span>DRIVE</span></h1>
    <p>Explore the city. Build your garage.</p>
    <button id="playBtn" class="primary">START GAME <span>→</span></button>
    <button id="garageBtn">MY GARAGE</button>
    <div class="menu-footer">WASD / ARROW KEYS · ESC TO PAUSE</div>
  </div>
</div>

<div id="pauseMenu" class="overlay hidden">
  <div class="menu-card">
    <div class="eyebrow">GAME PAUSED</div>
    <h1>PAUSED</h1>
    <button id="resumeBtn" class="primary">CONTINUE</button>
    <button id="pauseGarageBtn">MY GARAGE</button>
    <button id="quitBtn">MAIN MENU</button>
  </div>
</div>

<div id="garageMenu" class="overlay hidden">
  <div class="garage-card">
    <div class="eyebrow">YOUR COLLECTION</div>
    <h1>MY GARAGE</h1>
    <div id="garageCars" class="car-list"></div>
    <div class="garage-bottom">
      <span>YOUR MONEY: €<b id="garageMoney">0</b></span>
      <button id="closeGarage">BACK</button>
    </div>
  </div>
</div>

<div id="hud" class="hidden">
  <div class="topbar">
    <div class="brand">STREET<span>DRIVE</span></div>
    <div class="cash">€ <span id="money">0</span></div>
  </div>

  <div class="mission">
    <div class="mission-label">CURRENT MISSION</div>
    <b id="missionTitle">City Explorer</b>
    <div class="progress-bg"><div id="missionProgress"></div></div>
    <small id="missionText">Drive 500 meters</small>
  </div>

  <div class="bottom-hud">
    <div class="speed-panel">
      <div class="speed-number"><span id="speed">0</span><small>KM/H</small></div>
      <div class="gear" id="gear">N</div>
    </div>
    <div class="car-info">
      <b id="carName">CITY STARTER</b>
      <small>WASD TO DRIVE</small>
    </div>
  </div>

  <div class="minimap">
    <canvas id="map" width="150" height="150"></canvas>
    <small>YOUR LOCATION</small>
  </div>
</div>

<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
